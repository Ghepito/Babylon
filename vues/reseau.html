<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Babylon — Réseau du référentiel</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--gold:#e8c27a;--ink:#f3ead8;--panel:rgba(22,17,12,.92);--line:rgba(232,194,122,.3)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#14100c;color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif;overflow:hidden}
  #reseau{position:absolute;inset:0}
  .panel{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;z-index:2}
  #barre{top:10px;left:10px;width:300px;max-height:calc(100% - 20px);overflow:auto}
  h1{font-family:Cinzel,serif;color:var(--gold);letter-spacing:.15em;font-size:18px;margin:0 0 2px}
  .sous{opacity:.65;font-size:12px;margin-bottom:10px}
  input[type=search]{width:100%;padding:7px 9px;border-radius:7px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);font:inherit}
  .types{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px;margin:10px 0}
  .types label{display:flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer}
  .pastille{width:11px;height:11px;border-radius:3px;flex:none}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  button{padding:6px 9px;border-radius:7px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);font:12.5px Inter,sans-serif;cursor:pointer}
  button:hover,button.on{background:rgba(232,194,122,.2)}
  #valid{margin-top:10px;font-size:12.5px;padding:7px 9px;border-radius:7px}
  #valid.ok{background:rgba(70,160,90,.2);border:1px solid rgba(70,160,90,.5)}
  #valid.ko{background:rgba(220,80,60,.2);border:1px solid rgba(220,80,60,.5)}
  .legende{margin-top:10px;font-size:12px;opacity:.85}
  .legende div{display:flex;align-items:center;gap:6px}
  .trait{width:22px;height:0;border-top:2px solid}
  #fiche{top:10px;right:10px;width:360px;max-height:calc(100% - 20px);overflow:auto;display:none}
  #fiche h2{margin:0;font-family:Cinzel,serif;color:var(--gold);font-size:16px}
  #fiche .id{font-family:ui-monospace,monospace;font-size:12px;opacity:.6}
  #fiche h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.6;margin:12px 0 4px}
  #fiche ul{margin:0;padding-left:16px}
  #fiche li{margin:2px 0}
  #fiche a{color:var(--gold);cursor:pointer;text-decoration:none}
  .cache{color:#9fc3ff}
  .x{float:right;cursor:pointer;opacity:.6}
  #erreur{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:5}
</style>
</head>
<body>
<div id="reseau"></div>
<div id="barre" class="panel">
  <h1>BABYLON</h1>
  <div class="sous">Réseau du référentiel · <span id="stats"></span></div>
  <input id="recherche" type="search" placeholder="Rechercher (bois, feu, silex…)">
  <div class="types" id="types"></div>
  <div class="btns">
    <button id="bHier">Vue en chaînes</button>
    <button id="bTout">Tout afficher</button>
    <button id="bAjuster">Recentrer</button>
  </div>
  <div id="valid"></div>
  <div class="legende" id="legende"></div>
  <div class="legende" style="margin-top:8px">Clic : fiche détaillée · double-clic : n'afficher que son voisinage</div>
</div>
<div id="fiche" class="panel"></div>
<div id="erreur" class="panel"></div>

<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.13/standalone/umd/vis-network.min.js"></script>
<script>
"use strict";
const TYPES = {
  besoin:      {nom:"Besoins",       couleur:"#e2553b", forme:"hexagon"},
  source:      {nom:"Sources",       couleur:"#4f9d69", forme:"triangle"},
  ressource:   {nom:"Ressources",    couleur:"#c9a227", forme:"dot"},
  objet:       {nom:"Objets",        couleur:"#d98c3f", forme:"diamond"},
  installation:{nom:"Installations", couleur:"#b5651d", forme:"square"},
  procede:     {nom:"Procédés",      couleur:"#7f8c9a", forme:"box"},
  technique:   {nom:"Techniques",    couleur:"#5b8fd6", forme:"ellipse"},
  connaissance:{nom:"Connaissances", couleur:"#9b7fe0", forme:"star"},
  competence:  {nom:"Compétences",   couleur:"#3fb2b2", forme:"ellipse"},
};
const FAMILLES = {
  prerequis:     {nom:"Prérequis",      couleur:"#e2553b", tirets:[6,4]},
  transformation:{nom:"Consomme / produit", couleur:"#e8c27a", tirets:false},
  utilisation:   {nom:"Utilise / alimente", couleur:"#d98c3f", tirets:[2,4]},
  progression:   {nom:"Technique / découverte", couleur:"#9b7fe0", tirets:false},
  consequence:   {nom:"Effet sur un besoin", couleur:"#7bc47f", tirets:false},
  structure:     {nom:"Hiérarchie des compétences", couleur:"#3fb2b2", tirets:[1,3]},
};

function erreur(msg){ const e=document.getElementById('erreur'); e.style.display='flex'; e.innerHTML=msg; }

async function charger(){
  if (window.REFERENTIEL) return window.REFERENTIEL;
  const rep = await fetch('../data/referentiel.json', {cache:'no-store'});
  if (!rep.ok) throw new Error('HTTP '+rep.status);
  return rep.json();
}

charger().then(demarrer).catch(e=>erreur(
  "Impossible de lire <code>data/referentiel.json</code>.<br><br>Ouvrez cette page via GitHub Pages ou un petit serveur local<br>(<code>python3 -m http.server</code> à la racine du dépôt), pas en double-cliquant le fichier.<br><br><small>"+e.message+"</small>"));

function demarrer(REF){
  if (typeof vis === 'undefined'){ erreur("La bibliothèque de graphe n'a pas pu être chargée (connexion internet nécessaire)."); return; }
  const E = Object.fromEntries(REF.elements.map(e=>[e.id,e]));
  const famille = Object.fromEntries(REF.types_relation.map(t=>[t.code,t.famille]));
  const libelleRel = Object.fromEntries(REF.types_relation.map(t=>[t.code,t.libelle]));
  document.getElementById('stats').textContent = `${REF.elements.length} éléments · ${REF.relations.length} relations`;

  // validation
  const v = REF.validation, vd = document.getElementById('valid');
  if (v){ vd.className = v.erreurs ? 'ko':'ok';
    vd.innerHTML = v.erreurs ? `⚠️ ${v.erreurs} erreur(s) de cohérence — voir <code>referentiel/rapport-validation.md</code>`
                             : `✔ Référentiel cohérent (${v.alertes} alerte(s))`; }
  else vd.style.display='none';

  // légende des relations
  document.getElementById('legende').innerHTML = Object.values(FAMILLES).map(f=>
    `<div><span class="trait" style="border-color:${f.couleur};border-top-style:${f.tirets?'dashed':'solid'}"></span>${f.nom}</div>`).join('');

  const nodes = new vis.DataSet(REF.elements.map(e=>{
    const t = TYPES[e.type]||{couleur:'#999',forme:'dot'};
    const cachees = Object.values(e.proprietes||{}).some(m=>Object.values(m).some(p=>p.cachee));
    return { id:e.id, label:e.nom + (cachees?' 🔍':''), typ:e.type, shape:t.forme,
      color:{background:t.couleur, border:'#1b140e', highlight:{background:'#fff3d6',border:t.couleur}},
      font:{color: t.forme==='box'||t.forme==='ellipse' ? '#14100c' : '#f3ead8', size:13, face:'Inter'},
      size: e.type==='besoin'?20:14, title:`${TYPES[e.type]?.nom||e.type} — ${e.id}` };
  }));
  const edges = new vis.DataSet(REF.relations.filter(r=>E[r.cible]).map(r=>{
    const f = FAMILLES[famille[r.type]]||{couleur:'#888',tirets:false};
    const q = r.quantite!=null ? ` ${r.quantite} ${r.unite||E[r.cible].unite||''}` : '';
    const ctx = r.contexte && r.contexte!=='execution' ? ` (${r.contexte})` : '';
    return { id:r.id, from:r.source, to:r.cible, arrows:'to', dashes:f.tirets,
      color:{color:f.couleur, opacity:.55, highlight:f.couleur}, width:1.2,
      title:`${E[r.source].nom} — ${libelleRel[r.type]}${q}${ctx} → ${E[r.cible].nom}` };
  }));

  // filtres par type
  const actifs = new Set(Object.keys(TYPES));
  document.getElementById('types').innerHTML = Object.entries(TYPES).map(([k,t])=>{
    const n = REF.elements.filter(e=>e.type===k).length;
    return `<label><input type="checkbox" data-t="${k}" checked><span class="pastille" style="background:${t.couleur}"></span>${t.nom} (${n})</label>`; }).join('');
  let voisinage = null;
  const vueNodes = new vis.DataView(nodes, {filter: n => actifs.has(n.typ) && (!voisinage || voisinage.has(n.id))});
  const vueEdges = new vis.DataView(edges, {filter: e => vueNodes.get(e.from) && vueNodes.get(e.to)});
  document.querySelectorAll('#types input').forEach(cb=>cb.onchange=()=>{ cb.checked?actifs.add(cb.dataset.t):actifs.delete(cb.dataset.t); vueNodes.refresh(); vueEdges.refresh(); });

  const options = {
    physics:{solver:'forceAtlas2Based', forceAtlas2Based:{gravitationalConstant:-55, springLength:110, avoidOverlap:.4}, stabilization:{iterations:400}},
    interaction:{hover:true, tooltipDelay:120, navigationButtons:false},
    layout:{improvedLayout:true},
    edges:{smooth:{type:'continuous'}, arrows:{to:{scaleFactor:.5}}},
  };
  const net = new vis.Network(document.getElementById('reseau'), {nodes:vueNodes, edges:vueEdges}, options);
  window.__net = net;

  // vue en chaînes : profondeur de production, du monde (à gauche) vers les besoins (à droite)
  const DEP = ['CONSOMME','UTILISE','REQUIERT','MET_EN_OEUVRE'];
  const memo = {}, enCours = new Set();
  function profondeur(id){
    if (id in memo) return memo[id];
    if (enCours.has(id)) return 0;
    enCours.add(id);
    const e = E[id]; let d = 0;
    if (e.type === 'procede')
      d = 1 + Math.max(0, ...REF.relations.filter(r=>r.source===id && DEP.includes(r.type) && E[r.cible] && !(r.parametres&&r.parametres.optionnel)).map(r=>profondeur(r.cible)));
    else if (e.type === 'besoin')
      d = 1 + Math.max(0, ...REF.relations.filter(r=>r.cible===id && r.type==='SATISFAIT').map(r=>profondeur(r.source)));
    else if (e.type === 'technique')
      d = Math.max(0, ...REF.relations.filter(r=>r.source===id && r.type==='REQUIERT').map(r=>profondeur(r.cible)));
    else if (e.type === 'competence')
      d = Math.max(0, ...REF.relations.filter(r=>r.cible===id && r.type==='RELEVE_DE').map(r=>profondeur(r.source)));
    else { // ressources, objets, installations, connaissances : après le procédé qui les produit
      const prod = REF.relations.filter(r=>r.cible===id && (r.type==='PRODUIT'||r.type==='DEBLOQUE')).map(r=>profondeur(r.source));
      d = prod.length ? Math.min(...prod) : 0;
    }
    enCours.delete(id); memo[id] = d; return d;
  }
  let hier = false;
  document.getElementById('bHier').onclick = function(){
    hier = !hier; this.classList.toggle('on', hier);
    if (hier){
      const maxB = Math.max(...REF.elements.filter(e=>e.type!=='besoin').map(e=>profondeur(e.id)));
      nodes.update(REF.elements.map(e=>({id:e.id, level: e.type==='besoin' ? maxB+1 : e.type==='competence' ? maxB+2 : profondeur(e.id)})));
      net.setOptions({layout:{hierarchical:{enabled:true, direction:'LR', sortMethod:'hubsize', levelSeparation:230, nodeSpacing:58, treeSpacing:70, blockShifting:true, edgeMinimization:true, parentCentralization:false}}, physics:{enabled:false}, edges:{smooth:{type:'cubicBezier', forceDirection:'horizontal', roundness:.4}}});
    } else {
      net.setOptions({layout:{hierarchical:{enabled:false}}, physics:options.physics, edges:{smooth:{type:'continuous'}}});
    }
    setTimeout(()=>net.fit(), 80);
  };
  document.getElementById('bTout').onclick = ()=>{ voisinage=null; vueNodes.refresh(); vueEdges.refresh(); net.fit(); };
  document.getElementById('bAjuster').onclick = ()=>net.fit({animation:true});

  // recherche
  document.getElementById('recherche').oninput = e=>{
    const q = e.target.value.trim().toLowerCase(); if (!q) return;
    const n = REF.elements.find(x=>x.nom.toLowerCase().includes(q) || x.id.includes(q));
    if (n && vueNodes.get(n.id)){ net.selectNodes([n.id]); net.focus(n.id,{scale:1.3,animation:true}); fiche(n.id); }
  };

  // fiche
  const lien = id => E[id] ? `<a data-id="${id}">${E[id].nom}</a>` : `<span style="color:#e2553b">${id} (inexistant)</span>`;
  function fiche(id){
    const e = E[id], f = document.getElementById('fiche'); if (!e) return;
    const sort = REF.relations.filter(r=>r.source===id), ent = REF.relations.filter(r=>r.cible===id);
    const ligne = (r, autre) => `<li>${libelleRel[r.type]}${r.contexte&&r.contexte!=='execution'?' <i>('+r.contexte+')</i>':''} ${lien(autre)}${r.quantite!=null?` — ${r.quantite} ${r.unite||E[r.cible]?.unite||''}`:''}${r.parametres&&Object.keys(r.parametres).length?` <span style="opacity:.6">${JSON.stringify(r.parametres)}</span>`:''}</li>`;
    let props = '';
    for (const [mod, cles] of Object.entries(e.proprietes||{})) for (const [k,p] of Object.entries(cles))
      props += `<li class="${p.cachee?'cache':''}">${mod}.${k} : ${p.valeur??p.texte??''} ${p.unite||''}${p.cachee?' — <b>cachée</b> (à découvrir)':''}</li>`;
    const attrs = Object.entries(e.attributs||{}).map(([k,v])=>`<li>${k} : ${typeof v==='object'?JSON.stringify(v):v}</li>`).join('');
    f.innerHTML = `<span class="x" id="fx">✕</span><h2>${e.nom}</h2><div class="id">${e.id} · ${TYPES[e.type]?.nom||e.type} · phase ${e.phase} · ${e.statut==='VALIDE'?'VALIDÉ':'PROPOSÉ'}</div>
      ${e.description?`<p>${e.description}</p>`:''}
      ${e.unite?`<div>Unité : ${e.unite}</div>`:''}
      ${attrs?`<h3>Attributs</h3><ul>${attrs}</ul>`:''}
      ${props?`<h3>Propriétés</h3><ul>${props}</ul>`:''}
      ${sort.length?`<h3>Relations sortantes</h3><ul>${sort.map(r=>ligne(r,r.cible)).join('')}</ul>`:''}
      ${ent.length?`<h3>Relations entrantes</h3><ul>${ent.map(r=>`<li>${lien(r.source)} ${libelleRel[r.type]} ceci${r.quantite!=null?` — ${r.quantite}`:''}</li>`).join('')}</ul>`:''}`;
    f.style.display='block';
    document.getElementById('fx').onclick=()=>f.style.display='none';
    f.querySelectorAll('a[data-id]').forEach(a=>a.onclick=()=>{ const i=a.dataset.id; if(vueNodes.get(i)){net.selectNodes([i]); net.focus(i,{scale:1.2,animation:true});} fiche(i); });
  }
  net.on('click', p=>{ if (p.nodes.length) fiche(p.nodes[0]); });
  net.on('doubleClick', p=>{
    if (!p.nodes.length) return;
    const id = p.nodes[0]; voisinage = new Set([id]);
    REF.relations.forEach(r=>{ if(r.source===id) voisinage.add(r.cible); if(r.cible===id) voisinage.add(r.source); });
    vueNodes.refresh(); vueEdges.refresh(); setTimeout(()=>net.fit({animation:true}),50);
  });
}
</script>
</body>
</html>
